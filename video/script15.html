<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flat water remembers: 15-minute script</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { color-scheme: dark; --bg: #0A0D14; --panel: #10151F; --line: #1F2736; --text: #DCE2EC; --muted: #8A95AA; --faint: #5A6479; --cool: #4FD1C5; --amber: #FFB547; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 "IBM Plex Sans", system-ui, sans-serif; padding-inline: 16px; }
  .wrap { max-width: 900px; margin: 0 auto; padding-block: 28px 60px; }
  h1 { font-family: "STIX Two Text", serif; font-size: 34px; margin: 0 0 4px; } h2 { font-family: "STIX Two Text", serif; font-size: 23px; margin: 30px 0 8px; }
  p { color: #C8D0DC; } .muted { color: var(--muted); }
  .act { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 12px 0; }
  .act h3 { margin: 0 0 6px; font-size: 17px; display: flex; justify-content: space-between; gap: 12px; } .act h3 .wc { color: var(--faint); font: 13px "IBM Plex Mono", monospace; white-space: nowrap; }
  .act ol { margin: 6px 0 8px 20px; padding: 0; font-family: "STIX Two Text", serif; font-size: 18px; line-height: 1.55; } .act li { margin: 5px 0; }
  .note { font-size: 13.5px; color: var(--muted); margin-top: 4px; } .note b { color: var(--cool); font-weight: 500; } .note.k b { color: var(--amber); }
  textarea { width: 100%; box-sizing: border-box; height: 360px; background: #0C1119; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: 13px/1.5 "IBM Plex Mono", monospace; }
  button { font: inherit; color: var(--text); background: #141A26; border: 1px solid #2C3649; border-radius: 6px; padding: 8px 16px; cursor: pointer; } button:hover { border-color: var(--faint); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 10px 0; } #copied { color: var(--cool); font-size: 13px; }
  .total { font: 14px "IBM Plex Mono", monospace; color: var(--muted); }
</style></head>
<body><div class="wrap">
  <h1>Flat water remembers</h1>
  <p class="muted">Episode 3, story cut: about 15 minutes. Draft 1 of the full script, for outside review.</p>
  <div class="row"><button id="copy">Copy review brief + full script</button><span id="copied"></span></div>
  <p class="total" id="total"></p>
  <div id="acts"></div>
  <h2>What gets copied</h2>
  <textarea id="brief" readonly></textarea>
</div>
<script>
const ACTS = [
  { title: "Cold open", time: "0:00", names: "", picture: "The from-the-boat view: smooth river, wooded bank, dimples surfacing and drifting. Quick flashes of each teased image. Title: Flat water remembers.",
    lines: ["From a long wooden boat on the Rhine, a friend kept noticing small dimples on the water, beside the boat and ahead of it, mostly when the water was smooth. Some lasted a surprisingly long time.", "That shouldn't happen. A river is turbulent: every swirl in it is being sheared and torn by the others. So how does a whirlpool the size of a coin outlive the chaos that made it?", "The answer runs through a Victorian towing tank, a box of smoke rings that convinced Lord Kelvin that atoms were knots, a storm on Jupiter that has lasted for nearly two centuries, and a Nobel laureate who showed that whirlpools can have a negative temperature.", "And at the end, we'll come back to the river, where scientists now read what's happening underneath from dimples like these."] },
  { title: "1 · The numbers that rule natural flows", time: "1:00", names: "Osborne Reynolds (Manchester, 1883); William Froude (towing tank at Torquay, 1870s); G. I. Taylor (rotating-tank experiments, 1920s)",
    picture: "Reynolds' dye streak in a glass pipe, going from a clean line to a burst. Froude's tank with a towed model hull and its waves. Water flowing over a submerged rock. A rotating tank with a column of water moving as one.",
    knobs: "Reynolds number up → the dye streak bursts. Froude number over the rock up → faint dip, then a standing wave and a hydraulic jump past 1.",
    lines: ["Physicists size up any flow in nature with a couple of numbers.", "The first came from Osborne Reynolds, in Manchester, in 1883. He let a thin streak of dye into water flowing through a glass pipe. Slowly, the streak stayed a clean line. Faster, it suddenly shivered, burst, and filled the pipe.", "What decides it is one ratio: how strongly the moving water carries itself along, compared with how strongly its own friction holds it back. That's the Reynolds number: speed, times size, divided by viscosity.", "In Reynolds' pipe, the switch came at a few thousand. The Rhine, metres deep and moving at a metre or two per second, has a Reynolds number in the millions. Rivers are always turbulent.", "The second number came from ships. In the eighteen-seventies, the engineer William Froude towed model hulls through a long tank at Torquay, to predict the power a real ship would need. The trouble was waves: a model makes the right waves only if its speed, divided by the square root of gravity times its length, matches the real ship.", "That ratio is now called the Froude number. It measures how hard the flow pushes on the surface, compared with how hard gravity pulls the surface flat.", "Water over a rock shows it: at a low Froude number, a faint dip; past a Froude number of one, a standing wave.", "The Rhine beside that boat had a Froude number of about a fifth. So the river was two things at once: thoroughly turbulent, and nearly flat on top, held down by gravity like a lid.", "That combination is everywhere. The ocean and the atmosphere are layered, lighter over heavier, and gravity keeps the layers from churning up and down. Rotation does something similar: G. I. Taylor found that in a spinning tank, a whole column of water moves as one.", "Gravity, layering, rotation: across most of nature, something is squashing vertical motion flat. And that changes everything about turbulence."] },
  { title: "2 · What flatness does to turbulence", time: "3:45", names: "Lewis Fry Richardson (1922 rhyme); Andrei Kolmogorov (1941); Ragnar Fjørtoft (1953), Robert Kraichnan (1967), George Batchelor (1969); Lars Onsager (1949; Nobel Prize in Chemistry 1968); the 2019 superfluid experiments",
    picture: "A 3D vortex tube stretched thinner and faster until it frays. A live 2D turbulence simulation in which many small vortices merge into a few big ones. A soap film being stirred. A Jupiter-like band with a great spot swallowing small storms. Ocean eddies. Onsager's clustering of same-sign point vortices.",
    knobs: "stretch ×3 → spin ×3 (3D); flat: spin ×1.",
    lines: ["In 1922, the meteorologist Lewis Fry Richardson summed up turbulence in a rhyme: big whorls have little whorls that feed on their velocity, and little whorls have lesser whorls, and so on to viscosity.", "Energy pours in at the largest eddies and tumbles down to smaller ones, until friction turns it into heat. Andrei Kolmogorov made that cascade precise in 1941.", "The engine of the cascade is stretching. Stretch a spinning tube of fluid, and it gets thinner and spins faster, like a skater pulling in their arms. Stretch it three times longer, and it spins three times as fast, until it tears apart.", "But stretching needs a third dimension. Squash the flow flat, and a whirl has nowhere to be stretched into. Its spin is simply carried along.", "Ragnar Fjørtoft, Robert Kraichnan and George Batchelor worked out what that means, and it's startling. In flat turbulence, the cascade runs backwards. Small eddies don't shatter. They merge, and energy climbs to bigger and bigger scales.", "Physicists have watched it in soap films, about the flattest fluid we can make: stir one, and the little swirls merge into big ones.", "Nature does it on a planetary scale. Jupiter's weather lives in a thin, fast-spinning, layered shell, and its Great Red Spot, a vortex wider than the Earth that swallows smaller storms, has been watched every year since 1831. In our oceans, eddies a hundred kilometres across drift for months, and lenses of salty Mediterranean water called meddies spin for years.", "There's even a deeper reason flat vortices clump. In 1949, Lars Onsager, who later won a Nobel Prize, treated a crowd of point vortices like a gas. He found that when the crowd holds a lot of energy, it has a negative temperature, and at negative temperature, vortices spinning the same way huddle into giant clusters.", "For seventy years that looked like a mathematical curiosity. Then, in 2019, two teams stirred a flat layer of superfluid and watched exactly those clusters form.", "So flatness is what lets whirlpools last. But to see why a dimple exists at all, we need the rules that whirlpools obey."] },
  { title: "3 · The rules of vortices", time: "6:45", names: "Hermann von Helmholtz (1858); Peter Guthrie Tait (smoke-ring box, Edinburgh, 1867); William Thomson, Lord Kelvin (vortex atoms 1867; circulation theorem 1869); Tait's knot tables",
    picture: "Side view of a whirlpool's dip, with sunrays bent into a shadow and a bright rim; the top view of the shadow. A loop around a swirling core with its circulation readout. A vortex tube in 3D, sliced by the surface in a point; the shrinking-loop argument. Tait's smoke rings bouncing and wobbling; knotted rings; a page of knot tables. The arch with two feet on the surface; a paddle stroke; the pair sailing off.",
    knobs: "strength Γ ×2 → dip ×4; core ×2 (ageing) → dip ÷4 (optional silent Moon easter egg). Loop radius ×2 → speed ÷2, length ×2, circulation unchanged. Pair separation ÷2 → speed ×2.",
    lines: ["Start with what a dimple is. Water going round in a circle needs an inward push, and that push is pressure, lower at the centre. Lower pressure under the surface means less water on top: the surface dips.", "Call the whirlpool's strength gamma. Double it, and the dip gets four times deeper. Double the width of its core, as an ageing whirlpool slowly does, and the dip falls to a quarter.", "That little funnel is also a lens: in a shallow stream, it casts a dark shadow on the bed, with a bright edge.", "Gamma has a precise meaning: walk a loop in the water, adding up how hard the flow pushes you along. That total is the circulation. Well outside the core, double the loop's radius: the water is half as fast, but the walk is twice as long, so the circulation stays the same.", "From above, a whirlpool looks like a point. But water is three-dimensional, and what spins is really a line, running down into the river. A line meets the surface in a single point, and that point is the dimple.", "In 1858, Hermann von Helmholtz proved that vortex lines can't just stop in the water. Suppose one did. Slide a loop past its end, never crossing any spin, and its circulation can't change. Now shrink the loop to a point: the circulation is zero. So a vortex line must close into a ring, or end on a boundary, like the riverbed or the surface.", "Helmholtz's work had an unexpected sequel. In Edinburgh, Peter Guthrie Tait built a box that puffed out smoke rings, and showed them to his friend William Thomson, later Lord Kelvin. The rings bounced off each other, wobbled, and survived their collisions.", "Kelvin was captivated. By Helmholtz's rules, a vortex in a perfect fluid can never be created or destroyed, so a smoke ring there would last forever. Perhaps, Kelvin thought, atoms were knotted vortex rings in the ether, each kind of knot a different element.", "The theory was wrong. But Tait spent years drawing up tables of knots, hoping to match them to the elements, and those tables helped start the mathematics of knot theory.", "Kelvin also proved the rule in its cleanest form: in a perfect fluid, circulation around a loop moving with the water never changes. Still water has none, so a paddle's spin comes in equal amounts both ways. Bend a vortex line into an arch with both feet on the surface, and you see exactly that: two dimples, spinning opposite ways.", "Each one rides the other's swirl, so the pair sails off together. Bring them closer, and they go faster."] },
  { title: "4 · The river's own dimples", time: "10:00", names: "Gerard Matthes (1947, kolks and boils); Theodore Theodorsen (1952, hairpin vortices); Stephen Kline and colleagues at Stanford (1967, hydrogen-bubble films of bursting); free-surface turbulence simulations of the 1990s (Perot and Moin; Pan and Banerjee; Shen, Yue and colleagues)",
    picture: "A slab of river: the current's profile, a paddle wheel turning on the bed, a hairpin vortex lifting and breaking the surface as a pair. A boil spreading as a smooth patch. The pinned vortex end, the tube below it being twisted; converging, sinking water spinning a dimple up. A dimple fading. The boat view: ripples turned up until the dimples disappear, then smoothed.",
    knobs: "core ×2 → lasts ×4; winter vs summer water: viscosity ×1.5 → fades a third sooner. Ripple strength up → dimples hidden; smooth → visible.",
    lines: ["So where do the Rhine's dimples come from? Probably not paddles: there were hardly any boats. The source is the riverbed. Water touching it is held still, while a little way above, the current races past. That shear is spin: a paddle wheel lying on the bed would turn.", "River engineers have long known the signs. In 1947, Gerard Matthes described kolks, violent upward bursts from the beds of big rivers, and the boils they make at the surface: smooth, bulging patches of upwelling water.", "In 1952, Theodore Theodorsen proposed that the spin near a wall rolls up into arches, called hairpin vortices. And in 1967, a group at Stanford filmed hydrogen bubbles near a wall and caught the flow lifting away in bursts.", "A hairpin's head rises into faster water and is dragged upward. When it reaches the surface, the surface cuts it, and its two legs become a pair of dimples.", "Simulations in the nineteen-nineties showed what happens next. At the surface, the vortex must stand upright, and the water there mostly moves sideways. Deeper down, the tube keeps getting twisted and cut, but its end is pinned, like a rope tied to a ceiling. And where surface water converges and sinks, it stretches that end and spins it up.", "In the simplest model, with water moving only sideways, an upright whirlpool fades only as friction widens its core. Double the core, and it lasts four times as long. Winter water, about one and a half times as viscous as summer's, wears the same dimple down a third sooner.", "A dimple is only a millimetre or two deep, about as steep as a small ripple, so wind ripples hide it. Behind the boat, the propeller churns the surface; ahead and beside it, the river's own dimples float on smooth water."] },
  { title: "5 · The hidden order", time: "12:15", names: "William Rowan Hamilton (1830s); Joseph Liouville (area preservation); Gustav Kirchhoff (1876, point vortices); Hassan Aref (chaos with four vortices)",
    picture: "A pendulum's phase portrait: a point walking a contour, its velocity split into two arrows; a patch that stretches but keeps its area. The equations morph into the stream-function form, and the landscape becomes a pair of whirlpools. Three whirlpools dancing regularly; two runs of four started a micron apart; the camel-shaped dye (from episode 1) stretched into filaments at 100% area.",
    knobs: "the two velocity components as live arrows; one whirlpool's strength ×3 → centre of spin slides toward it (same-sign trio).",
    lines: ["There's one more surprise in these whirlpools, and it's mathematical.", "Think of a pendulum. Plot its angle across and its momentum up, and its whole state becomes a single moving point. Draw the contours of its energy, and the point follows a contour, rather than rolling downhill. That's Hamilton's rule, the backbone of mechanics, and it has a famous consequence: a patch of starting states can stretch, but never changes its area.", "Water on a flat surface can't be squashed, so it keeps its area too. That's no coincidence. A speck of water on the surface follows exactly Hamilton's rule, on a landscape called the stream function. The river's surface is its own phase space.", "In 1876, Gustav Kirchhoff showed that the whirlpools themselves obey it: each is carried by the others' swirl, and together they follow the slopes of one landscape, with each whirlpool's strength as a weight.", "With three whirlpools, the dance stays regular. With four, it can turn chaotic: start two runs a micron apart, and within seconds they're doing completely different things."] },
  { title: "6 · Reading the river", time: "13:45", names: "Simen Ellingsen, Omer Babiker and colleagues (Norwegian University of Science and Technology, 2023 onward); surface-divergence models of air–water gas transfer",
    picture: "The boat view with dimples being counted; a map of upwelling and sinking under the surface lining up with where dimples appear. Oxygen and carbon dioxide crossing the surface. Back to the boat; pull back; end card (next episode: soap films).",
    knobs: "",
    lines: ["Which brings us back to the boat.", "Recently, a group in Trondheim, Norway, around Simen Ellingsen and Omer Babiker, asked whether you could read a river's turbulence from its surface. In their simulations, the number of dimples in a patch of water tracked, remarkably closely, how much water was welling up and sinking there.", "That matters, because the same welling up and sinking renews the skin of the water, and how fast the skin is renewed helps set how fast a river breathes: how quickly it takes up oxygen and gives off carbon dioxide.", "So counting dimples might one day tell us things we'd otherwise need instruments under the water to measure.", "Those dimples beside the boat were the ends of vortex lines born on the riverbed, often one half of a pair, pinned upright by a surface that gravity keeps flat. And a friend who noticed how long some of them lasted was already, in a way, making the measurement."] },
];
const words = s => s.split(/\s+/).filter(Boolean).length;
let total = 0; const host = document.getElementById("acts");
for (const a of ACTS) {
  const wc = a.lines.reduce((s, l) => s + words(l), 0); total += wc; a.wc = wc;
  const d = document.createElement("div"); d.className = "act";
  d.innerHTML = `<h3><span>${a.title} <span class="muted" style="font-weight:400">· ${a.time}</span></span><span class="wc">${wc} words</span></h3>` +
    (a.names ? `<div class="note"><b>People:</b> ${a.names}</div>` : "") + `<ol>${a.lines.map(l => `<li>${l}</li>`).join("")}</ol>` +
    `<div class="note">Picture: ${a.picture}</div>` + (a.knobs ? `<div class="note k"><b>Knobs:</b> ${a.knobs}</div>` : "");
  host.appendChild(d);
}
document.getElementById("total").textContent = `${total} words · about ${(total / 147 + (ACTS.reduce((n, a) => n + a.lines.length, 0) * 0.9 + 80) / 60).toFixed(1)} minutes (voice at 147 words/min, pauses between lines, about a minute of dialled experiments and titles)`;

const BRIEF = `You are reviewing and revising the full narration script for an educational video of about 15 minutes, in the spirit of Veritasium: story-driven, with people, history and real-world surprises, plus a few "dial a parameter and watch the flow change" visuals rendered from simulation.

PREMISE
A friend, on a long wooden boat on the Rhine, noticed small dimples on the water: there were few boats; the dimples appeared beside and ahead of the boat, were most visible on smooth water, and some lasted a long time. The question: in a turbulent river, how does a whirlpool the size of a coin outlive the chaos that made it? The unifying idea: gravity (a low Froude number), layering (stratification) and rotation flatten natural flows, and flattened flows keep their vortices. The dimples come back at the end as an active research topic (reading sub-surface turbulence from surface dimples). This is episode 3 of a small series; episode 1 was about Gromov's non-squeezing theorem ("the symplectic camel").

PLEASE DO
1. Fact-check every name, date, number and claim. Flag anything wrong, misattributed, oversimplified or contested, with a correction and a source where you can. Pay particular attention to: the Reynolds and Froude history; the Rhine's Reynolds and Froude numbers (depth a few metres, speed 1 to 2 m/s); Taylor columns; the 2D inverse cascade (Fjortoft, Kraichnan, Batchelor, Leith); soap-film experiments; the Great Red Spot (size, continuous observation since 1831, swallowing smaller storms); ocean eddies and meddies; Onsager's negative-temperature vortex clusters and the 2019 superfluid experiments; Helmholtz 1858; Tait's smoke-ring box and Kelvin's vortex atoms (1867) and circulation theorem (1869); Tait's knot tables; Matthes 1947 (kolks and boils); Theodorsen 1952; Kline et al. 1967; 1990s free-surface turbulence simulations; the NTNU dimple work (Babiker, Ellingsen and colleagues) and the link from surface divergence to gas transfer; winter water being about 1.5 times as viscous as summer water.
2. Judge the story: is the thread clear, does each act earn its place, is anything missing that a curious viewer would want, and where does it sag? Suggest cuts or merges to land at 15 minutes.
3. Improve the writing for the ear: warm, curious, precise, conversational; short sentences; no hype words; no rhetorical "what if I told you". Keep the friend anonymous and add no details about the trip beyond the premise.
4. Keep it speakable by a text-to-speech voice: spell symbols as words (gamma), write years as a speaker would say them if that helps, avoid abbreviations and bare single letters.

PHYSICS THAT MUST STAY RIGHT (flag rather than silently change)
- Dip depth h = Gamma^2 / (8 pi^2 g a^2) for a vortex of circulation Gamma and core radius a: Gamma x2 gives h x4; core x2 gives h /4. The dip is a diverging lens in the middle: a dark shadow with a bright caustic rim on the bed of shallow water.
- Circulation is the loop integral of velocity; outside the core the swirl speed is Gamma / (2 pi r), so a loop twice as big has half the speed and twice the length, same circulation.
- Vortex lines cannot end inside the fluid (div omega = 0): they close, or end on a boundary. The shrinking-loop argument is the intended proof sketch.
- Kelvin: circulation around a material loop is constant in an ideal fluid; a big loop in still water that never touches the paddle stays at zero, so the paddle's spin is net zero. The arch (half vortex ring) gives two dimples of opposite sign. A counter-rotating pair moves at Gamma / (2 pi d).
- 3D stretching intensifies vorticity (D omega/Dt = (omega . grad) u). At a flat stress-free surface vortex lines meet the surface at right angles. The surface does not by itself make the flow two-dimensional: converging, sinking surface water stretches and intensifies upright vortices. "Water that moves only sideways" is introduced as a model.
- Viscous spreading: fade time scales as core size squared over viscosity (the exact a^2 -> a^2 + 4 nu t law belongs to the Lamb-Oseen vortex and is not used as such).
- Hamilton: dq/dt = dH/dp, dp/dt = -dH/dq; phase-space area is conserved (Liouville). In 2D incompressible flow, dx/dt = d psi/dy, dy/dt = -d psi/dx.
- Kirchhoff 1876: Gamma_k dx_k/dt = dH/dy_k, Gamma_k dy_k/dt = -dH/dx_k; the conjugate pair is (x_k, Gamma_k y_k); Gamma is a signed weight, not a mass. Three vortices are integrable; four can be chaotic (the example shown was measured: starts one micron apart separate to one centimetre in about six seconds).

WHAT TO RETURN
1. The revised script in the same format (act headers, one line per sentence group), with a word count (target about 1,850 words; the voice speaks about 147 words per minute and the edit adds pauses and about a minute of dialled experiments).
2. A fact-check table: claim, verdict, correction, source.
3. A short list of structural changes and why, and any line where the picture would need to change.

THE SCRIPT
`;
const scriptText = ACTS.map(a => `${a.title} (starts about ${a.time}; ${a.wc} words)` + (a.names ? `\n[People: ${a.names}]` : "") + `\n[Picture: ${a.picture}]` + (a.knobs ? `\n[Dialled experiments: ${a.knobs}]` : "") + "\n" + a.lines.map(l => "- " + l).join("\n")).join("\n\n") + `\n\n(Total: ${total} words.)`;
const ta = document.getElementById("brief"); ta.value = BRIEF + "\n" + scriptText;
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); document.execCommand("copy"); }
  document.getElementById("copied").textContent = "Copied."; setTimeout(() => document.getElementById("copied").textContent = "", 2500);
};
</script></body></html>
