<script>
(() => {
  const V = window.Vortex, WR = window.WaterRenderer, T = window.TIMING, W = 1280, H = 720, TAU = 2 * Math.PI;
  const c = document.getElementById("c").getContext("2d"), glCanvas = document.getElementById("gl"), glpCanvas = document.getElementById("glp");
  const water = new WR(glCanvas, { preserve: true, gridX: 700, gridY: 434, causticW: 1280, causticH: 794, dyeW: 1536, dyeH: 1000 });
  const waterP = new WR(glpCanvas, { preserve: true, gridX: 520, gridY: 334, causticW: 900, causticH: 578 });
  const TEAL = "#4FD1C5", AMBER = "#FFB547", GLASS = "#6FA8FF", VIOLET = "#B28DFF", PINK = "#FF6FA0", TEXT = "#DCE2EC", MUTED = "#8A95AA", BG = "#0A0D14";
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), ss = (t, a, b) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
  const font = (px, w = 400, fam = "IBM Plex Sans") => { c.font = `${w} ${px}px "${fam}"`; };
  const serif = (px, w = 400, it = false) => { c.font = `${it ? "italic " : ""}${w} ${px}px "STIX Two Text"`; };
  function arrowHead(x, y, ang, s) { c.beginPath(); c.moveTo(x + s * Math.cos(ang), y + s * Math.sin(ang)); c.lineTo(x + s * Math.cos(ang + 2.5), y + s * Math.sin(ang + 2.5)); c.lineTo(x + s * Math.cos(ang - 2.5), y + s * Math.sin(ang - 2.5)); c.closePath(); c.fill(); }
  function arrow(x0, y0, x1, y1, s = 8) { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); arrowHead(x1, y1, Math.atan2(y1 - y0, x1 - x0), s); }
  function spin(x, y, r, ccw, col, ph = 0, lw = 2.5) { c.strokeStyle = col; c.fillStyle = col; c.lineWidth = lw; c.beginPath(); const a0 = ph, a1 = ph + 4.4;
    if (ccw) c.arc(x, y, r, -a0, -a1, true); else c.arc(x, y, r, a0, a1, false); c.stroke(); const ae = ccw ? -a1 : a1; arrowHead(x + r * Math.cos(ae), y + r * Math.sin(ae), ae + (ccw ? -Math.PI / 2 : Math.PI / 2), 7); }
  function text(str, x, y, px = 26, col = TEXT, align = "center", w = 500, fam = "IBM Plex Sans") { c.font = `${w} ${px}px "${fam}"`; c.fillStyle = col; c.textAlign = align; c.fillText(str, x, y); }
  function label(str, x, y, col = MUTED, px = 18, align = "left") { text(str, x, y, px, col, align, 500); }
  function chip(str, x, y, col = GLASS) { font(16, 600); const w = c.measureText(str).width + 20; c.fillStyle = "rgba(10,14,22,0.8)"; c.strokeStyle = col; c.lineWidth = 1.5; c.beginPath(); c.roundRect(x, y - 20, w, 28, 6); c.fill(); c.stroke(); c.fillStyle = col; c.textAlign = "left"; c.fillText(str, x + 10, y); }
  function panel(x, y, w, h) { c.fillStyle = "#10151F"; c.strokeStyle = "#1F2736"; c.lineWidth = 1; c.beginPath(); c.roundRect(x, y, w, h, 10); c.fill(); c.stroke(); }
  function wrap(str, maxw) { const words = str.split(" "), out = []; let cur = ""; for (const w of words) { const t = cur ? cur + " " + w : w; if (c.measureText(t).width > maxw && cur) { out.push(cur); cur = w; } else cur = t; } if (cur) out.push(cur); return out; }
  const rng = seed => { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); };

  // ------------------------------------------------------------------ the live-parameter equation device
  const fmt = r => { const v = r >= 1 ? r : 1 / r, s = Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : v.toFixed(1); return (r >= 1 ? "×" : "÷") + s; };
  const K = (t, r, col, name, o = {}) => { const e = Math.abs(Math.log2(r)), on = clamp(e / 0.2); return { t, ...o, knob: true, name, ratio: r, emph: 1.2 * on, scale: clamp(r ** 0.12, 0.72, 1.4), color: e > 0.02 ? col : TEXT, lane: 150 * on }; };
  const P = (t, o = {}) => ({ t, ...o });
  function tokW(tk, fs) { const sc = tk.scale || 1; serif(fs * sc, 400, tk.it); let w = c.measureText(tk.t).width; if (tk.sup) { serif(fs * sc * 0.58); w += c.measureText(tk.sup).width + fs * 0.04; } return w + (tk.lane || 0); }
  function tokDraw(tk, x, y, fs) {
    const sc = tk.scale || 1, e = tk.emph || 0, col = tk.color || TEXT; c.save(); c.fillStyle = col; c.strokeStyle = col; c.lineJoin = "round";
    if (e > 0) { c.shadowColor = col; c.shadowBlur = 20 * Math.min(1, e); }
    serif(fs * sc, e > 0.35 ? 700 : 400, tk.it); c.textAlign = "left"; c.fillText(tk.t, x, y); if (e > 0) { c.lineWidth = 1.6 * Math.min(1.4, e); c.strokeText(tk.t, x, y); }
    let w = c.measureText(tk.t).width;
    if (tk.sup) { serif(fs * sc * 0.58, e > 0.35 ? 700 : 400); c.fillText(tk.sup, x + w + fs * 0.04, y - fs * sc * 0.42); w += c.measureText(tk.sup).width + fs * 0.04; }
    c.restore();
    if (tk.knob) { const L = 40 * Math.log2(tk.ratio), a = clamp(Math.abs(Math.log2(tk.ratio)) / 0.25); if (a > 0.02) {
      const ax = x + w + 18, ym = y - fs * 0.32, dir = Math.sign(L), y0 = ym + dir * 18, y1 = y0 - L;
      c.save(); c.globalAlpha = a; c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 6; c.lineCap = "round"; c.beginPath(); c.moveTo(ax, y0); c.lineTo(ax, y1 + dir * 7); c.stroke();
      c.beginPath(); c.moveTo(ax, y1 - dir * 8); c.lineTo(ax - 12, y1 + dir * 12); c.lineTo(ax + 12, y1 + dir * 12); c.closePath(); c.fill();
      font(26, 600, "IBM Plex Mono"); c.textAlign = "left"; c.fillText(`${tk.name} ${fmt(tk.ratio)}`, ax + 16, y1 + (dir > 0 ? 9 : 20));
      if (tk.note) { font(19, 500); c.globalAlpha = a * 0.85; c.fillText(tk.note, ax + 16, y1 + (dir > 0 ? 32 : 44)); } c.restore(); } }
    return w + (tk.lane || 0);
  }
  // items: tokens, or {num:[...], den:[...]}
  function equation(items, cx, y, fs = 64) {
    const gap = fs * 0.18, rowW = r => r.reduce((s, t) => s + tokW(t, fs) + gap, -gap);
    const itemW = it => it.num ? Math.max(rowW(it.num), rowW(it.den)) + fs * 0.3 : tokW(it, fs);
    const total = items.reduce((s, it) => s + itemW(it) + gap * 1.6, -gap * 1.6); let x = cx - total / 2;
    for (const it of items) {
      if (it.num) { const wf = itemW(it), wn = rowW(it.num), wd = rowW(it.den); c.fillStyle = TEXT; c.fillRect(x, y - fs * 0.3, wf, Math.max(2, fs * 0.04));
        let xn = x + (wf - wn) / 2; for (const t of it.num) xn += tokDraw(t, xn, y - fs * 0.52, fs) + gap;
        let xd = x + (wf - wd) / 2; for (const t of it.den) xd += tokDraw(t, xd, y + fs * 0.66, fs) + gap; x += wf + gap * 1.6; }
      else x += tokDraw(it, x, y, fs) + gap * 1.6;
    }
  }

  // ------------------------------------------------------------------ the river (vortices, boils, current)
  const BOAT = { pos: [0, -26, 7.5], target: [0, 6, 0], fov: 32 };
  function River(seed, o = {}) {
    const r = { sys: V.makeSystem({ a: 0.6, U: o.U ?? 1.5 }), born: [], pid: [], next: 1, rnd: rng(seed), nextBoil: 0.5, boils: o.boils ?? true, t: 0 };
    r.add = (x, y, G, b = r.t, p = 0) => { V.add(r.sys, x, y, G); r.born.push(b); r.pid.push(p); };
    r.pair = (x, y, ang, G, d, b = r.t) => { const nx = -Math.sin(ang), ny = Math.cos(ang), p = r.next++; r.add(x + nx * d / 2, y + ny * d / 2, G, b, p); r.add(x - nx * d / 2, y - ny * d / 2, -G, b, p); };
    const cut = i => { r.sys.x.splice(i, 1); r.sys.y.splice(i, 1); r.sys.G.splice(i, 1); r.born.splice(i, 1); r.pid.splice(i, 1); };
    r.step = (dt, cam) => {
      const n = Math.max(1, Math.ceil(dt / 0.02)); for (let k = 0; k < n; k++) r.last = V.step(r.sys, dt / n); r.t += dt;
      if (r.boils && r.t > r.nextBoil) { r.nextBoil = r.t + 1.6 + 2.8 * r.rnd(); if (r.sys.x.length < 20) { const w = cam ? WR.unproject(cam, W, H, W * (0.1 + 0.6 * r.rnd()), H * (0.42 + 0.48 * r.rnd())) : [(r.rnd() - 0.6) * 40, (r.rnd() - 0.5) * 20]; if (w) r.pair(w[0], w[1], r.rnd() * TAU, 40 + 40 * r.rnd(), 2.5 + 2 * r.rnd()); } }
      for (let i = r.sys.x.length - 1; i >= 0; i--) if (i < r.sys.x.length && (Math.abs(r.sys.x[i]) > 70 || r.sys.y[i] < -40 || r.sys.y[i] > 70)) { const p = r.pid[i]; cut(i); if (p) for (let j = r.pid.length - 1; j >= 0; j--) if (r.pid[j] === p) cut(j); }
    };
    r.vortices = () => r.sys.x.map((x, i) => [x, r.sys.y[i], r.sys.G[i], clamp((r.t - r.born[i]) / 0.8)]);
    return r;
  }
  const boatOpts = (r, cam = BOAT, extra = {}) => ({ camera: cam, time: r.t, U: r.sys.U, k: 6.2, sunShift: [-2.0, -2.7], sunBlur: 0.06, ripple: 0.009, a: 0.35, exaggerate: 1.0, slopeVis: 1.3, murk: 0.13,
    waterColor: [0.06, 0.10, 0.08], causticWin: [-45, -15, 45, 55], dyeWin: [-40, -25, 40, 55], vortices: r.vortices(), ...extra });
  const topOpts = (r, scale, extra = {}) => ({ scale, cx: 0, cy: 0, time: r.t, U: r.sys.U, k: 6.2, sunShift: [-2.0, -2.7], sunBlur: 0.06, ripple: 0.009, a: 0.6, exaggerate: 1.15, glint: 0.2, vortices: r.vortices(), ...extra });

  // ------------------------------------------------------------------ 2D turbulence (pseudo-spectral, vorticity form)
  function Turb(N, seed) {
    const n2 = N * N, R = () => new Float64Array(n2); let wr = R(), wi = R(); const tmp = Array.from({ length: 12 }, R);
    const kx = new Float64Array(N); for (let i = 0; i < N; i++) kx[i] = i <= N / 2 ? i : i - N;
    const rev = new Uint32Array(N), lg = Math.log2(N); for (let i = 0; i < N; i++) { let r = 0; for (let b = 0; b < lg; b++) r |= ((i >> b) & 1) << (lg - 1 - b); rev[i] = r; }
    const cs = new Float64Array(N / 2), sn = new Float64Array(N / 2); for (let i = 0; i < N / 2; i++) { cs[i] = Math.cos(TAU * i / N); sn[i] = -Math.sin(TAU * i / N); }
    const br = new Float64Array(N), bi = new Float64Array(N);
    function fft1(re, im, inv) {
      for (let i = 0; i < N; i++) { const j = rev[i]; if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
      for (let size = 2; size <= N; size <<= 1) { const half = size >> 1, step = N / size;
        for (let s = 0; s < N; s += size) for (let k = 0; k < half; k++) { const wr_ = cs[k * step], wi_ = inv ? -sn[k * step] : sn[k * step], a = s + k, b = a + half;
          const tr = re[b] * wr_ - im[b] * wi_, ti = re[b] * wi_ + im[b] * wr_; re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti; } }
      if (inv) for (let i = 0; i < N; i++) { re[i] /= N; im[i] /= N; }
    }
    function fft2(re, im, inv) {
      for (let y = 0; y < N; y++) { for (let x = 0; x < N; x++) { br[x] = re[y * N + x]; bi[x] = im[y * N + x]; } fft1(br, bi, inv); for (let x = 0; x < N; x++) { re[y * N + x] = br[x]; im[y * N + x] = bi[x]; } }
      for (let x = 0; x < N; x++) { for (let y = 0; y < N; y++) { br[y] = re[y * N + x]; bi[y] = im[y * N + x]; } fft1(br, bi, inv); for (let y = 0; y < N; y++) { re[y * N + x] = br[y]; im[y * N + x] = bi[y]; } }
    }
    // initial vortices
    const rnd = rng(seed), w0 = R(), z = R();
    for (let k = 0; k < 180; k++) { const cx = rnd() * N, cy = rnd() * N, sg = k % 2 ? 1 : -1, s2 = 2 * (1.6 + 1.4 * rnd()) ** 2, A = sg * (1.2 + 0.8 * rnd());
      for (let dy = -9; dy <= 9; dy++) for (let dx = -9; dx <= 9; dx++) { const x = ((Math.floor(cx) + dx) % N + N) % N, y = ((Math.floor(cy) + dy) % N + N) % N, rx = Math.floor(cx) + dx - cx, ry = Math.floor(cy) + dy - cy; w0[y * N + x] += A * Math.exp(-(rx * rx + ry * ry) / s2); } }
    wr.set(w0); wi.fill(0); fft2(wr, wi, false);
    const kmax = N / 3, nuh = 2e-7 * 0;
    function rhs(ar, ai, or, oi) {
      const [ur, ui, vr, vi, xr, xi, yr, yi] = tmp;
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const q = j * N + i, KX = kx[i], KY = kx[j], k2 = KX * KX + KY * KY || 1;
        const pr = ar[q] / k2, pi = ai[q] / k2;                                // psi = w / k^2 (sign: w = -lap psi)
        ur[q] = -KY * pi; ui[q] = KY * pr;                                      // u = d psi/dy
        vr[q] = KX * pi; vi[q] = -KX * pr;                                      // v = -d psi/dx
        xr[q] = -KX * ai[q]; xi[q] = KX * ar[q]; yr[q] = -KY * ai[q]; yi[q] = KY * ar[q]; }
      for (const [a, b] of [[ur, ui], [vr, vi], [xr, xi], [yr, yi]]) fft2(a, b, true);
      for (let q = 0; q < n2; q++) { or[q] = -(ur[q] * xr[q] + vr[q] * yr[q]); oi[q] = 0; }
      fft2(or, oi, false);
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const q = j * N + i; if (Math.abs(kx[i]) > kmax || Math.abs(kx[j]) > kmax) { or[q] = 0; oi[q] = 0; } }
    }
    const k1r = R(), k1i = R(), k2r = R(), k2i = R(), mr = R(), mi = R(), acr = R(), aci = R();
    const T_ = { N, t: 0, field: R(),
      step(dt) {                                                                  // classical RK4, then a hyperviscous filter
        rhs(wr, wi, k1r, k1i); for (let q = 0; q < n2; q++) { mr[q] = wr[q] + 0.5 * dt * k1r[q]; mi[q] = wi[q] + 0.5 * dt * k1i[q]; acr[q] = k1r[q]; aci[q] = k1i[q]; }
        rhs(mr, mi, k2r, k2i); for (let q = 0; q < n2; q++) { mr[q] = wr[q] + 0.5 * dt * k2r[q]; mi[q] = wi[q] + 0.5 * dt * k2i[q]; acr[q] += 2 * k2r[q]; aci[q] += 2 * k2i[q]; }
        rhs(mr, mi, k2r, k2i); for (let q = 0; q < n2; q++) { mr[q] = wr[q] + dt * k2r[q]; mi[q] = wi[q] + dt * k2i[q]; acr[q] += 2 * k2r[q]; aci[q] += 2 * k2i[q]; }
        rhs(mr, mi, k2r, k2i);
        for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const q = j * N + i, k2 = kx[i] * kx[i] + kx[j] * kx[j], damp = Math.exp(-dt * 6e-6 * k2 * k2);
          wr[q] = (wr[q] + dt / 6 * (acr[q] + k2r[q])) * damp; wi[q] = (wi[q] + dt / 6 * (aci[q] + k2i[q])) * damp; }
        T_.t += dt;
      },
      physical() { const fr = T_.field, fi = tmp[8]; fr.set(wr); fi.set(wi); fft2(fr, fi, true); return fr; } };
    return T_;
  }
  window._Turb = Turb;
  const turbImg = document.createElement("canvas"), turbCtx = turbImg.getContext("2d");
  function drawTurb(tb, x, y, w, h, palette) {
    const N = tb.N; turbImg.width = N; turbImg.height = N; const img = turbCtx.createImageData(N, N), f = tb.physical(); let m = 0; for (let q = 0; q < N * N; q++) m = Math.max(m, Math.abs(f[q]));
    for (let q = 0; q < N * N; q++) { const v = clamp(f[q] / (0.7 * m + 1e-9), -1, 1), [r, g, b] = palette(v); img.data[4 * q] = r; img.data[4 * q + 1] = g; img.data[4 * q + 2] = b; img.data[4 * q + 3] = 255; }
    turbCtx.putImageData(img, 0, 0); c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high"; c.drawImage(turbImg, x, y, w, h);
  }
  const palSpin = v => v > 0 ? [10 + 69 * v, 13 + 196 * v, 20 + 177 * v] : [10 - 245 * v, 13 - 168 * v, 20 - 51 * v];
  const palSoap = v => { const h = 0.5 + 0.5 * v; return [128 + 110 * Math.sin(TAU * (h * 1.6)), 128 + 110 * Math.sin(TAU * (h * 1.6 + 0.33)), 128 + 110 * Math.sin(TAU * (h * 1.6 + 0.66))]; };
  const palJup = v => { const a = 0.5 + 0.5 * v; return [200 + 40 * a, 150 + 70 * a - 30 * (1 - a), 100 + 90 * a]; };

  // ------------------------------------------------------------------ scenes
  // cue: [beat id, line index within the beat]; a scene lasts until the next scene's cue
  const figs = window.FIGS;
  const FIG = (id, x, y, w, h, t) => { const f = figs[id]; f.at(t); c.drawImage(f.canvas, x, y, w, h); };
  const setLines = m => document.querySelector(`[data-line="${m}"]`).click(), setHam = m => document.querySelector(`[data-ham="${m}"]`).click();
  const SC = [];
  const scene = (beat, line, o) => SC.push({ beat, line, ...o });

  // ---- open
  scene("open", 0, { id: "boat-open", gl: true, reset() { this.r = River(3); [[-9, 4, 0.4, 60], [7, 11, 2.6, 55], [1, -3, -1.2, 65], [13, -6, 1.9, 50]].forEach(([x, y, a, G]) => this.r.pair(x, y, a, G, 3, -99)); },
    draw(S) { this.r.step(S.dt, BOAT); water.render(boatOpts(this.r)); } });
  scene("open", 3, { id: "funnel", reset() {}, draw(S) {
    const lt = S.lt, ys = 250, yb = 640, cx = 640, A = 64;
    c.fillStyle = "#0E1622"; c.fillRect(0, 0, W, H);
    const eta = x => -A / (1 + ((x - cx) / 70) ** 2) * ss(lt, 0.2, 2.2);
    c.fillStyle = "rgba(60,120,160,0.25)"; c.beginPath(); c.moveTo(0, yb); for (let x = 0; x <= W; x += 8) c.lineTo(x, ys - eta(x)); c.lineTo(W, yb); c.closePath(); c.fill();
    c.strokeStyle = GLASS; c.lineWidth = 3; c.beginPath(); for (let x = 0; x <= W; x += 4) x ? c.lineTo(x, ys - eta(x)) : c.moveTo(x, ys - eta(x)); c.stroke();
    c.fillStyle = "rgba(111,168,255,0.18)"; c.fillRect(cx - 34, ys + 10, 68, yb - ys - 10);
    for (let k = 0; k < 6; k++) { const y = ys + 60 + k * 58; c.save(); c.translate(cx, y); c.scale(1, 0.28); spin(0, 0, 70, true, "rgba(200,225,255,0.8)", lt * 3 + k, 3); c.restore(); }
    if (S.after(4)) { const a = ss(S.T, S.L(4), S.L(4) + 1); c.globalAlpha = a; c.strokeStyle = AMBER; c.fillStyle = AMBER; c.lineWidth = 3; for (const s of [-1, 1]) arrow(cx + s * 230, ys + 110, cx + s * 90, ys + 110, 10);
      label("pressure pushes inward", cx + 250, ys + 116, AMBER, 20); c.globalAlpha = 1; }
